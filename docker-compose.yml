# QQ 官方机器人平台部署。
#
# 和旧的 OneBot 部署相比，这份 compose 里**没有** pmhq、也没有 llbot：
# 官方平台直接提供 WebSocket 网关，机器人不需要在本地跑一个登录着的 QQ 客户端，
# 因此也就不需要 `qq_volume` 那个设备卷（QQ 登录态、扫码、风控那一整套都没有了）。
# 整栈只剩一个服务。
#
# 凭据来自 QQ 开放平台 (https://q.qq.com)，填在 KirikoBot/.env 里：
#   QQ_APP_ID      机器人 AppID
#   QQ_APP_SECRET  机器人 AppSecret
# 启动后到面板「连接」页可以看到网关连接状态。
services:
  my-robot:
    build:
      context: ./KirikoBot
      dockerfile: Dockerfile
    # 和旧栈（container_name: kirikobot）刻意错开：两个 compose 项目同时在时，
    # 同名容器会被对方 up 的时候抢走/重建。
    container_name: kirikobot-qq
    command: ["waitress-serve", "--host=0.0.0.0", "--port=5000", "--threads=16", "main:app"]
    ports:
      - "5000:5000"
    env_file:
      - ./KirikoBot/.env
    volumes:
      - ./KirikoBot:/app
    networks:
      - app_network
    restart: always
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    healthcheck:
      # /healthz 免面板鉴权。"/" 现在无凭据会返回 401，拿它做健康检查会一直不健康。
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  app_network:
    driver: bridge
